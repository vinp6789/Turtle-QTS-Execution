# Which strategy plugins the runtime loads. Product configuration, NOT
# research: nothing here implies a governance decision.
#
# A plugin trades only if `enabled = true` -- literally true, nothing else.
# Every plugin loads through the identical path (alpha_engine.platform),
# so adding a future alpha strategy means adding a registry entry and a
# block here, and nothing else.
#
# Registered plugins: python -c "from alpha_engine.platform import STRATEGY_REGISTRY; print(sorted(STRATEGY_REGISTRY))"

[[strategies]]
# LIFECYCLE PROBE -- INFRASTRUCTURE VALIDATION ONLY -- DISABLED BY DEFAULT
#
# One entry, one reduce-only exit, then silence. It exists solely to prove
# the close half of the canonical execution path, which no production
# component had ever reached: as of 2026-08-08 nothing emitted
# reduce_only=True, so POSITION_CLOSED had never occurred.
#
# NOT research. Never enters the Alpha Library, Research Ledger, a
# campaign, the Mechanism Atlas, a scorecard, or any profitability claim.
#
# SAFETY MODEL, STATED PLAINLY: small notional + supervised execution +
# manual UI close fallback. NOT a stop-protected trade -- no venue-side
# trigger order exists and no stop-breach monitor runs, so the stop
# prices below are SIZING INPUTS ONLY and nothing will act on them. If
# the process stops between entry and exit, the position stays open at
# the venue until closed by hand.
#
# stop_fraction is WIDE on purpose: through the existing sizing identity
# (size = equity * risk_pct / |entry - stop|) a wide stop yields a SMALL
# position. At equity 999 and BTC ~64,900, 0.30 gives ~0.00026 BTC
# (~$17), above the venue's $10 minimum. risk_pct_per_trade is untouched.
#
# exit_stop_fraction is NARROW on purpose: it makes the computed exit size
# exceed the open position, and reduce_only then clamps it to exactly the
# remaining quantity -- a full close rather than a residue.
#
# Enable ONLY for an explicitly authorised, supervised testnet run, and
# set it back to false immediately afterwards.
name = "lifecycle_probe"
enabled = false

[strategies.params]
symbol = "BTC"
stop_fraction = "0.30"
exit_stop_fraction = "0.075"
limit_slip = "0.001"

[[strategies]]
# PIPELINE VALIDATION STRATEGY -- NOT FOR TRADING -- KNOWN NEGATIVE EXPECTANCY
#
# An ENGINE TEST PLUGIN: a unit test that happens to emit deterministic
# orders. Its purpose is to continuously exercise entries, exits, sizing,
# portfolio accounting, the order lifecycle, recovery, monitoring and
# metrics. It is EXPECTED TO LOSE -- the specification was REJECTED by the
# research gate on 2026-08-06 (hit rate 0.4353 vs a 0.55 bar, z = -3.5).
#
# It is not research. It appears in no Alpha Library, Research Ledger,
# campaign, Mechanism Atlas or scorecard.
name = "pipeline_validation"
enabled = true

[strategies.params]
symbols = ["BTC", "ETH", "SOL"]
cadence_seconds = 3600
# 0.01, NOT the 0.40 the research campaign froze. This is an ENGINE TEST:
# a threshold that never fires cannot exercise the pipeline, which is this
# plugin's only purpose. It is a harness setting, not a research parameter --
# the campaign's own 0.40 remains untouched in its sealed evidence.
threshold = "0.01"
direction_convention = "momentum"
atr_stop_mult = "2.0"
atr_t1_mult = "3.0"
atr_t2_mult = "4.0"
